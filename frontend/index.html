<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content-Security-Policy, duplicated as a real HTTP header in
      frontend/nginx.conf for the web/Docker deployment (meta tags can't
      carry frame-ancestors/report-uri, and Nginx isn't in front of the
      Capacitor-bundled native build, so this tag is the only CSP that
      protects that target). Keep both in sync if origins change:
        - fonts.googleapis.com / fonts.gstatic.com — Inter webfont (below)
        - images.unsplash.com — login/register hero images
        - *.tile.openstreetmap.org — Leaflet map tiles (drive location maps)
        - data:/blob: in img-src — avatars, car photos, and route images are
          stored as base64 and rendered as data-URI <img> tags
        - connect-src allows any https: host rather than one hardcoded API
          origin, since VITE_API_URL varies per deployment (local/staging/prod)
        - http://192.168.1.148:* is a TEMPORARY local-device-testing entry —
          the backend's plain-HTTP LAN address for physical-device Capacitor
          builds, since a real phone (unlike the Android emulator's fixed
          10.0.2.2 alias) can only reach the dev machine via its actual LAN
          IP, which changes per network/machine. Remove before any real
          deployment; a real release build should point at an HTTPS backend,
          already covered by the blanket `https:` allowance above.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com https://*.tile.openstreetmap.org; connect-src 'self' https: http://localhost:* http://10.0.2.2:* http://192.168.1.148:*; base-uri 'self'; form-action 'self'; object-src 'none'" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png" />
    <!-- viewport-fit=cover renders edge-to-edge on iPhone notch / Dynamic Island -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DriveClique</title>

    <!-- PWA / app metadata -->
    <meta name="application-name" content="DriveClique" />
    <meta name="description" content="Connect. Drive. Repeat." />
    <meta name="theme-color" content="#dc2626" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Apple PWA (Safari "Add to Home Screen") -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DriveClique" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/apple-touch-icon-152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/apple-touch-icon-167.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
