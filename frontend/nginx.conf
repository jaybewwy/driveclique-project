server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;

    # SPA: all paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Aggressive caching for versioned static assets (Vite fingerprints filenames)
    location ~* \.(js|css|woff|woff2|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # No caching for the HTML entry point so the browser always fetches new chunk manifests
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
