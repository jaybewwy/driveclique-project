# Cache-Control per kind of file, chosen here and sent by the single
# add_header in the server block below.
#
# It is done this way, rather than with an add_header inside each location,
# because of how nginx inherits add_header: a location that has even one of
# its own inherits none from the server block. The locations for index.html
# and for *.js / *.css used to set Cache-Control themselves, which silently
# dropped every security header from the page and its scripts. No location
# in this file may contain add_header; add a line to this map instead.
#
# $uri is the file actually served, so a client-side route such as /dashboard
# (which falls back to /index.html) gets index.html's value.
map $uri $cache_control {
    default                             "";

    # The HTML entry point is never cached, so the browser always sees new chunk names
    /index.html                         "no-store";

    # The pre-paint theme script comes from public/ and keeps its plain name
    # (index.html loads it with an ordinary <script>), so unlike the
    # fingerprinted bundles it has to be revalidated on each load
    /theme-init.js                      "no-cache";

    # Fingerprinted assets (Vite puts a content hash in the name) never change
    ~*\.(js|css|woff|woff2|ttf|otf)$    "public, immutable";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;

    # Baseline browser security headers — helmet() (backend/server.js) covers
    # the JSON API, but nothing previously covered the actual page the
    # browser renders. Values kept identical to the CSP in index.html's
    # <meta> tag (see that file for the source-list rationale) so both stay
    # in sync; frame-ancestors/report-uri only work as a real header, not via
    # <meta>, which is the one directive added here beyond the meta tag.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # geolocation=(self), not (): Find Clubs' "Use my location" button (UC-46)
    # needs it on our own origin. Embedded third-party frames still get nothing.
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com https://*.tile.openstreetmap.org; connect-src 'self' https: http://localhost:*; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # See the map above. An empty value sends no Cache-Control header at all.
    add_header Cache-Control $cache_control;

    # SPA: all paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # A year for fingerprinted assets: `expires` adds max-age (and Expires),
    # the map above adds "public, immutable"
    location ~* \.(js|css|woff|woff2|ttf|otf)$ {
        expires 1y;
    }

    # Kept out of the block above: this one is not fingerprinted
    location = /theme-init.js {
    }
}
