name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

# Least-privilege default for the GITHUB_TOKEN — none of these jobs push
# commits, comment on PRs, or otherwise need write access to repo contents.
permissions:
  contents: read

jobs:
  # ── 1. Lint + build check ──────────────────────────────────────────────────
  lint-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: cd frontend && npm ci --legacy-peer-deps

      - name: Lint
        run: cd frontend && npm run lint

      - name: Build (catch compile errors)
        run: cd frontend && npm run build

  # ── 2. Security audit ─────────────────────────────────────────────────────
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit backend
        run: cd backend && npm audit --audit-level=high

      - name: Install frontend deps
        run: cd frontend && npm ci --legacy-peer-deps

      - name: Audit frontend
        run: cd frontend && npm audit --audit-level=high

  # ── 3. E2E Playwright tests ────────────────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Backend env — never commit real secrets; these are CI-only values
      MONGO_URI: mongodb://localhost:27017/driveclique_ci
      JWT_SECRET: ci-only-test-secret-not-for-production-use-at-all
      NODE_ENV: development
      PORT: 5000
      FRONTEND_URL: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend deps
        run: cd backend && npm ci

      - name: Install frontend deps
        run: cd frontend && npm ci --legacy-peer-deps

      - name: Install Playwright browsers (Chromium only)
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Start backend
        run: cd backend && node server.js > /tmp/backend.log 2>&1 &

      - name: Start frontend dev server
        run: cd frontend && npm run dev > /tmp/frontend.log 2>&1 &

      - name: Wait for both servers
        run: |
          until curl -sf http://localhost:5000 > /dev/null; do sleep 1; done
          echo "Backend is up"
          until curl -sf http://localhost:5173 > /dev/null; do sleep 1; done
          echo "Frontend is up"
        timeout-minutes: 3

      - name: Show server logs on failure
        if: failure()
        run: |
          echo "── backend.log ──"; cat /tmp/backend.log || true
          echo "── frontend.log ──"; cat /tmp/frontend.log || true

      - name: Run Playwright tests
        run: cd frontend && npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            /tmp/backend.log
            /tmp/frontend.log
          retention-days: 7
